name: Напоминание о внесении данных перед концом смены

on:
  workflow_dispatch:
    inputs:
      shift_type:
        description: 'Тип смены: day или night'
        required: true
        default: 'day'

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Set up job
        uses: actions/checkout@v3

      # ЭТОТ ШАГ КРИТИЧЕСКИ ВАЖЕН: он ставит зависимости из package.json
      - name: Install dependencies
        run: npm ci

      - name: Определить тип смены по расписанию
        run: echo "Проверяем смену: \${{ inputs.shift_type }}"
        # Здесь можно оставить вашу логику определения смены, если она была

      - name: Запустить скрипт напоминаний
        run: node reminder.js
        env:
          BOT_TOKEN: \${{ secrets.BOT_TOKEN }}
          FIREBASE_DATABASE_URL: \${{ secrets.FIREBASE_DATABASE_URL }}
          TZ_OFFSET_HOURS: 3
          SHIFT_TYPE: \${{ inputs.shift_type }}
