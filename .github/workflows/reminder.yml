name: Напоминание о внесении данных перед концом смены

on:
  schedule:
    # 14:40 UTC = 17:40 МСК — за 1ч20м до конца дневной смены (07:00-19:00)
    - cron: '40 14 * * *'
    # 02:40 UTC = 05:40 МСК — за 1ч20м до конца ночной смены (19:00-07:00)
    - cron: '40 2 * * *'
  workflow_dispatch:
    inputs:
      shift_type:
        description: 'Какую смену проверить вручную (для теста)'
        required: true
        default: 'day'
        type: choice
        options: ['day', 'night']

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код репозитория
        uses: actions/checkout@v4

      - name: Определить тип смены по расписанию
        id: shift
        run: |
          if [ "${{ github.event.schedule }}" = "40 14 * * *" ]; then
            echo "type=day" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "40 2 * * *" ]; then
            echo "type=night" >> "$GITHUB_OUTPUT"
          else
            echo "type=${{ github.event.inputs.shift_type }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Запустить скрипт напоминаний
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          TZ_OFFSET_HOURS: '3'
          SHIFT_TYPE: ${{ steps.shift.outputs.type }}
        run: node reminder.js
