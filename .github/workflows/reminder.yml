name: Remind

on:
  workflow_dispatch:
    inputs:
      shift_type:
        description: 'Тип смены: day или night'
        required: true
        default: 'day'
        type: choice
        options:
          - day
          - night

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      # Шаг 1: Скачивание кода (работает у вас отлично)
      - name: Checkout code
        uses: actions/checkout@v3

      # Шаг 2: Установка зависимостей (критически важно для package.json)
      - name: Install dependencies
        run: npm ci

      # Шаг 3: Запуск вашего скрипта
      - name: Run reminder script
        run: node reminder.js
        env:
          BOT_TOKEN: \${{ secrets.BOT_TOKEN }}
          FIREBASE_DATABASE_URL: \${{ secrets.FIREBASE_DATABASE_URL }}
          TZ_OFFSET_HOURS: 3
          SHIFT_TYPE: \${{ inputs.shift_type }}
