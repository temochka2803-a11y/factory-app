<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Учёт деталей</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #f4f6f8; color: #222; padding-bottom: 70px; }
  header { background: #2563eb; color: #fff; padding: 12px 16px; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 6px rgba(0,0,0,.1); }
  header h1 { font-size: 18px; font-weight: 600; }
  header .sub { font-size: 12px; opacity: .85; }
  .container { max-width: 720px; margin: 0 auto; padding: 12px; }
  .card { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .card h2 { font-size: 16px; margin-bottom: 10px; color: #1e3a8a; }
  .card h3 { font-size: 14px; margin: 10px 0 6px; color: #374151; }
  label { display: block; font-size: 13px; color: #4b5563; margin: 8px 0 4px; }
  input, select, textarea { width: 100%; padding: 9px 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; background: #fff; }
  input:focus, select:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
  button { padding: 10px 14px; border: none; border-radius: 8px; background: #2563eb; color: #fff; font-size: 14px; cursor: pointer; font-weight: 500; }
  button:hover { background: #1d4ed8; }
  button.secondary { background: #e5e7eb; color: #111827; }
  button.secondary:hover { background: #d1d5db; }
  button.danger { background: #dc2626; }
  button.danger:hover { background: #b91c1c; }
  button.success { background: #059669; }
  button.small { padding: 5px 9px; font-size: 12px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .tabs { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; display: flex; border-top: 1px solid #e5e7eb; z-index: 10; }
  .tab { flex: 1; padding: 8px 4px; text-align: center; font-size: 11px; color: #6b7280; cursor: pointer; border: none; background: none; }
  .tab.active { color: #2563eb; font-weight: 600; }
  .tab .ico { display: block; font-size: 18px; margin-bottom: 2px; }
  .hidden { display: none !important; }
  .record { border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px; margin-bottom: 8px; background: #fafafa; }
  .record .top { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
  .record .qty { font-size: 18px; font-weight: 600; color: #059669; }
  .record .meta { font-size: 12px; color: #6b7280; margin-top: 4px; }
  .record .actions { display: flex; gap: 4px; }
  .stat { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f3f4f6; }
  .stat:last-child { border-bottom: none; }
  .stat .v { font-weight: 600; color: #1e3a8a; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; background: #dbeafe; color: #1e40af; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 12px; }
  .modal { background: #fff; border-radius: 12px; padding: 16px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
  .modal h2 { margin-bottom: 12px; }
  details.summary { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; }
  details.summary > summary { cursor: pointer; font-weight: 600; color: #1e40af; list-style: none; display: flex; justify-content: space-between; align-items: center; }
  details.summary > summary::after { content: '▼'; font-size: 10px; transition: transform .2s; }
  details.summary[open] > summary::after { transform: rotate(180deg); }
  details.summary > summary::-webkit-details-marker { display: none; }
  details.summary .body { margin-top: 10px; }
  .log-entry { font-size: 12px; padding: 6px 8px; background: #fef3c7; border-left: 3px solid #f59e0b; margin-bottom: 4px; border-radius: 4px; }
  .log-entry .ts { color: #6b7280; font-size: 11px; }
  .month-group { margin-bottom: 16px; }
  .month-group h3 { background: #1e40af; color: #fff; padding: 8px 12px; border-radius: 8px 8px 0 0; font-size: 14px; }
  .month-group .body { border: 1px solid #e5e7eb; border-top: none; border-radius: 0 0 8px 8px; padding: 10px; background: #fff; }
  .filter-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .filter-bar .full { grid-column: 1 / -1; }
  .empty { text-align: center; color: #9ca3af; padding: 20px; font-size: 13px; }
  .toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: #059669; color: #fff; padding: 10px 18px; border-radius: 8px; z-index: 200; font-size: 14px; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
  .toast.err { background: #dc2626; }
  .code-box { background: #111827; color: #10b981; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 16px; text-align: center; letter-spacing: 2px; margin: 8px 0; }
  .chip { display: inline-block; padding: 4px 10px; background: #e0e7ff; color: #3730a3; border-radius: 12px; font-size: 12px; margin: 2px; cursor: pointer; }
  .chip.active { background: #2563eb; color: #fff; }
</style>
</head>
<body>

<header>
  <h1>🏭 Учёт деталей</h1>
  <div class="sub" id="headerSub">Войдите или создайте бригаду</div>
</header>

<div class="container" id="app"></div>

<nav class="tabs hidden" id="tabs">
  <button class="tab active" data-tab="input"><span class="ico">📝</span>Ввод</button>
  <button class="tab" data-tab="brigade"><span class="ico">👥</span>Бригада</button>
  <button class="tab" data-tab="schedule"><span class="ico">📅</span>График</button>
  <button class="tab" data-tab="salary"><span class="ico">💰</span>Зарплата</button>
  <button class="tab" data-tab="history"><span class="ico">🔍</span>История</button>
  <button class="tab" data-tab="report"><span class="ico">📄</span>Отчёт</button>
</nav>

<script>
/* =========================================================
   ХРАНИЛИЩЕ (localStorage)
   ========================================================= */
const DB = {
  load(key, def) { try { return JSON.parse(localStorage.getItem(key)) ?? def; } catch { return def; } },
  save(key, val) { localStorage.setItem(key, JSON.stringify(val)); },
};

let state = {
  currentUser: DB.load('currentUser', null),
  users: DB.load('users', []),
  brigades: DB.load('brigades', []),
  records: DB.load('records', []),
  categories: DB.load('categories', [
    { id: 'c1', name: 'Корпус' }, { id: 'c2', name: 'Крышка' }, { id: 'c3', name: 'Вал' }
  ]),
  details: DB.load('details', [
    { id: 'd1', name: 'Корпус-100', categoryId: 'c1' },
    { id: 'd2', name: 'Крышка-50', categoryId: 'c2' },
    { id: 'd3', name: 'Вал-200', categoryId: 'c3' }
  ]),
  changeLog: DB.load('changeLog', []),
  salarySettings: DB.load('salarySettings', {}), // { userId: { lastMonthSalary, lastMonthOutput } }
  schedule: DB.load('schedule', {}), // { userId: { 'YYYY-MM-DD': 'day'|'night'|'off' } }
  currentTab: 'input',
};

function persist() {
  DB.save('currentUser', state.currentUser);
  DB.save('users', state.users);
  DB.save('brigades', state.brigades);
  DB.save('records', state.records);
  DB.save('categories', state.categories);
  DB.save('details', state.details);
  DB.save('changeLog', state.changeLog);
  DB.save('salarySettings', state.salarySettings);
  DB.save('schedule', state.schedule);
}

const uid = () => Math.random().toString(36).slice(2, 10);
const todayISO = () => new Date().toISOString().slice(0, 10);
const monthKey = (d) => d.slice(0, 7);
const fmtMoney = (n) => (Math.round(n) || 0).toLocaleString('ru-RU') + ' ₽';
const fmtDate = (iso) => {
  const [y, m, d] = iso.split('-');
  return `${d}.${m}.${y}`;
};
const monthName = (key) => {
  const [y, m] = key.split('-');
  const names = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  return `${names[+m - 1]} ${y}`;
};

function toast(msg, err) {
  const t = document.createElement('div');
  t.className = 'toast' + (err ? ' err' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

/* =========================================================
   ЛОГ ИЗМЕНЕНИЙ
   ========================================================= */
function logChange(recordId, field, oldValue, newValue, who) {
  state.changeLog.push({
    id: uid(),
    ts: new Date().toISOString(),
    userId: who,
    recordId,
    field,
    old: oldValue,
    new: newValue,
  });
  persist();
}

function getUserName(id) {
  const u = state.users.find(x => x.id === id);
  return u ? `${u.lastName} ${u.firstName || ''}`.trim() : '—';
}
function getDetailName(id) {
  const d = state.details.find(x => x.id === id);
  return d ? d.name : '—';
}
function getCategoryName(id) {
  const c = state.categories.find(x => x.id === id);
  return c ? c.name : '—';
}

/* =========================================================
   РОУТЕР ВКЛАДОК
   ========================================================= */
document.getElementById('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  state.currentTab = btn.dataset.tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === btn));
  render();
});

/* =========================================================
   РЕНДЕР
   ========================================================= */
const app = document.getElementById('app');
const tabsEl = document.getElementById('tabs');
const headerSub = document.getElementById('headerSub');

function render() {
  if (!state.currentUser) { renderAuth(); tabsEl.classList.add('hidden'); headerSub.textContent = 'Войдите или создайте бригаду'; return; }
  tabsEl.classList.remove('hidden');
  const u = state.users.find(x => x.id === state.currentUser);
  const b = state.brigades.find(x => x.id === u.brigadeId);
  headerSub.textContent = `${u.lastName} ${u.firstName} · ${b ? b.name : '—'}`;

  switch (state.currentTab) {
    case 'input': renderInput(); break;
    case 'brigade': renderBrigade(); break;
    case 'schedule': renderSchedule(); break;
    case 'salary': renderSalary(); break;
    case 'history': renderHistory(); break;
    case 'report': renderReport(); break;
  }
}

/* ---------- АВТОРИЗАЦИЯ ---------- */
function renderAuth() {
  app.innerHTML = `
    <div class="card">
      <h2>🏭 Учёт выработки</h2>
      <p style="font-size:13px;color:#6b7280;margin-bottom:10px">Укажите свои данные — они сохранятся.</p>
      <label>Фамилия</label><input id="aLast" placeholder="Иванов">
      <label>Имя</label><input id="aFirst" placeholder="Иван">
      <label>Отчество</label><input id="aMid" placeholder="Иванович">
      <div class="row" style="margin-top:12px">
        <button onclick="openBrigadeFlow('create')">Создать бригаду</button>
        <button class="secondary" onclick="openBrigadeFlow('join')">Присоединиться</button>
      </div>
    </div>
    <div id="brigadeFlow"></div>
  `;
}

window.openBrigadeFlow = (mode) => {
  const last = document.getElementById('aLast').value.trim();
  const first = document.getElementById('aFirst').value.trim();
  const mid = document.getElementById('aMid').value.trim();
  if (!last) { toast('Введите фамилию', true); return; }

  const flow = document.getElementById('brigadeFlow');
  if (mode === 'create') {
    flow.innerHTML = `
      <div class="card">
        <h2>Новая бригада</h2>
        <label>Наименование завода / цеха</label>
        <input id="bName" placeholder="Цех №5">
        <button style="margin-top:12px" onclick="createBrigade()">Создать</button>
      </div>
    `;
    window._pendingUser = { last, first, mid };
  } else {
    flow.innerHTML = `
      <div class="card">
        <h2>Присоединиться по коду</h2>
        <label>Код бригады</label>
        <input id="bCode" placeholder="Например: A3F9K2" style="text-transform:uppercase">
        <p style="font-size:12px;color:#6b7280;margin-top:6px">Код даёт мастер бригады.</p>
        <button style="margin-top:12px" onclick="joinBrigade()">Продолжить</button>
      </div>
    `;
    window._pendingUser = { last, first, mid };
  }
};

window.createBrigade = () => {
  const name = document.getElementById('bName').value.trim() || 'Моя бригада';
  const code = uid().slice(0, 6).toUpperCase();
  const brigade = { id: uid(), name, code, members: [] };
  const u = window._pendingUser;
  const user = { id: uid(), lastName: u.last, firstName: u.first, middleName: u.mid, brigadeId: brigade.id, role: 'master' };
  brigade.members.push(user.id);
  state.brigades.push(brigade);
  state.users.push(user);
  state.currentUser = user.id;
  persist();
  toast('Бригада создана. Код: ' + code);
  render();
  showBrigadeCode(code);
};

window.joinBrigade = () => {
  const code = document.getElementById('bCode').value.trim().toUpperCase();
  const brigade = state.brigades.find(b => b.code === code);
  if (!brigade) { toast('Код не найден', true); return; }
  const u = window._pendingUser;
  const user = { id: uid(), lastName: u.last, firstName: u.first, middleName: u.mid, brigadeId: brigade.id, role: 'worker' };
  brigade.members.push(user.id);
  state.users.push(user);
  state.currentUser = user.id;
  persist();
  toast('Вы присоединились к бригаде');
  render();
};

function showBrigadeCode(code) {
  openModal(`
    <h2>Код вашей бригады</h2>
    <p style="font-size:13px;color:#6b7280">Сохраните и отправьте работникам:</p>
    <div class="code-box">${code}</div>
    <div class="row">
      <button onclick="navigator.clipboard.writeText('${code}');toast('Скопировано')">📋 Скопировать</button>
      <button class="secondary" onclick="closeModal()">Продолжить</button>
    </div>
  `);
}

/* ---------- ВВОД ---------- */
function renderInput() {
  const me = state.users.find(u => u.id === state.currentUser);
  const date = todayISO();
  const myRecs = state.records.filter(r => r.workerId === me.id && r.date === date);
  const total = myRecs.reduce((s, r) => s + (+r.quantity || 0), 0);

  app.innerHTML = `
    <div class="card">
      <h2>📝 Новая запись · ${fmtDate(date)}</h2>
      <label>Категория</label>
      <select id="inCat">
        <option value="">— выберите —</option>
        ${state.categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
      </select>
      <label>Наименование детали</label>
      <select id="inDet">
        <option value="">— выберите —</option>
        ${state.details.map(d => `<option value="${d.id}" data-cat="${d.categoryId}">${d.name} (${getCategoryName(d.categoryId)})</option>`).join('')}
      </select>
      <label>Количество, шт</label>
      <input id="inQty" type="number" min="0" placeholder="0">
      <button style="margin-top:12px;width:100%" onclick="addRecord()">+ Добавить запись</button>
    </div>

    <div class="card">
      <h2>Мои записи за сегодня · итого: <span class="badge">${total} шт</span></h2>
      ${myRecs.length === 0 ? '<div class="empty">Пока нет записей</div>' :
        myRecs.map(r => recordHTML(r, me.id)).join('')}
    </div>
  `;

  document.getElementById('inCat').addEventListener('change', (e) => {
    const catId = e.target.value;
    const sel = document.getElementById('inDet');
    [...sel.options].forEach(o => {
      o.hidden = catId && o.dataset.cat !== catId;
    });
  });
}

function recordHTML(r, currentUserId) {
  const logs = state.changeLog.filter(l => l.recordId === r.id);
  const logsHTML = logs.length ? `
    <div style="margin-top:8px;padding-top:8px;border-top:1px dashed #e5e7eb">
      <div style="font-size:11px;color:#6b7280;margin-bottom:4px">История изменений (${logs.length}):</div>
      ${logs.slice(-5).reverse().map(l => `
        <div class="log-entry">
          <div class="ts">${new Date(l.ts).toLocaleString('ru-RU')} · ${getUserName(l.userId)}</div>
          <div>${fieldLabel(l.field)}: <b>${l.old ?? '—'}</b> → <b>${l.new ?? '—'}</b></div>
        </div>
      `).join('')}
      ${logs.length > 5 ? `<div style="font-size:11px;color:#9ca3af;margin-top:4px">…и ещё ${logs.length - 5}</div>` : ''}
    </div>
  ` : '';

  return `
    <div class="record">
      <div class="top">
        <div>
          <div><b>${getDetailName(r.detailId)}</b> <span class="badge">${getCategoryName(r.categoryId)}</span></div>
          <div class="meta">📅 ${fmtDate(r.date)} · автор: ${getUserName(r.createdBy)}</div>
        </div>
        <div class="qty">${r.quantity} шт</div>
      </div>
      <div class="actions" style="margin-top:8px">
        <button class="small secondary" onclick="editRecord('${r.id}')">✎ Изменить</button>
        <button class="small danger" onclick="deleteRecord('${r.id}')">🗑 Удалить</button>
      </div>
      ${logsHTML}
    </div>
  `;
}

function fieldLabel(f) {
  return { quantity: 'Количество', detailId: 'Деталь', categoryId: 'Категория', date: 'Дата', workerId: 'Работник' }[f] || f;
}

window.addRecord = () => {
  const detId = document.getElementById('inDet').value;
  const qty = +document.getElementById('inQty').value;
  if (!detId) { toast('Выберите деталь', true); return; }
  if (!qty || qty <= 0) { toast('Укажите количество', true); return; }
  const det = state.details.find(d => d.id === detId);
  const r = {
    id: uid(),
    workerId: state.currentUser,
    date: todayISO(),
    categoryId: det.categoryId,
    detailId: detId,
    quantity: qty,
    createdAt: new Date().toISOString(),
    createdBy: state.currentUser,
  };
  state.records.push(r);
  logChange(r.id, 'quantity', null, qty, state.currentUser);
  logChange(r.id, 'detailId', null, det.name, state.currentUser);
  persist();
  toast('Запись добавлена');
  render();
};

window.deleteRecord = (id) => {
  if (!confirm('Удалить запись?')) return;
  state.records = state.records.filter(r => r.id !== id);
  state.changeLog = state.changeLog.filter(l => l.recordId !== id);
  persist();
  toast('Удалено');
  render();
};

window.editRecord = (id) => {
  const r = state.records.find(x => x.id === id);
  if (!r) return;
  openModal(`
    <h2>✎ Редактирование записи</h2>
    <label>Дата</label>
    <input type="date" id="eDate" value="${r.date}">
    <label>Категория</label>
    <select id="eCat">
      ${state.categories.map(c => `<option value="${c.id}" ${c.id === r.categoryId ? 'selected' : ''}>${c.name}</option>`).join('')}
    </select>
    <label>Деталь</label>
    <select id="eDet">
      ${state.details.map(d => `<option value="${d.id}" ${d.id === r.detailId ? 'selected' : ''}>${d.name}</option>`).join('')}
    </select>
    <label>Количество, шт</label>
    <input type="number" id="eQty" value="${r.quantity}" min="0">
    <div class="row" style="margin-top:14px">
      <button class="secondary" onclick="closeModal()">Отмена</button>
      <button onclick="saveEdit('${id}')">Сохранить</button>
    </div>
  `);
};

window.saveEdit = (id) => {
  const r = state.records.find(x => x.id === id);
  const newDate = document.getElementById('eDate').value;
  const newCat = document.getElementById('eCat').value;
  const newDet = document.getElementById('eDet').value;
  const newQty = +document.getElementById('eQty').value;

  if (r.date !== newDate) logChange(id, 'date', r.date, newDate, state.currentUser);
  if (r.categoryId !== newCat) logChange(id, 'categoryId', getCategoryName(r.categoryId), getCategoryName(newCat), state.currentUser);
  if (r.detailId !== newDet) logChange(id, 'detailId', getDetailName(r.detailId), getDetailName(newDet), state.currentUser);
  if (r.quantity !== newQty) logChange(id, 'quantity', r.quantity, newQty, state.currentUser);

  r.date = newDate; r.categoryId = newCat; r.detailId = newDet; r.quantity = newQty;
  persist();
  closeModal();
  toast('Изменения сохранены');
  render();
};

/* ---------- БРИГАДА ---------- */
function renderBrigade() {
  const me = state.users.find(u => u.id === state.currentUser);
  const b = state.brigades.find(x => x.id === me.brigadeId);
  const members = state.users.filter(u => u.brigadeId === b.id);
  const others = members.filter(m => m.id !== me.id);

  const todayRecs = state.records.filter(r => r.date === todayISO() && members.some(m => m.id === r.workerId));
  const total = todayRecs.reduce((s, r) => s + (+r.quantity || 0), 0);

  app.innerHTML = `
    <div class="card">
      <h2>👥 ${b.name}</h2>
      <div class="stat"><span>Код бригады</span><span class="v">${b.code}</span></div>
      <div class="stat"><span>Участников</span><span class="v">${members.length}</span></div>
      <div class="stat"><span>Итого сегодня</span><span class="v">${total} шт</span></div>
    </div>

    <div class="card">
      <h3>Участники</h3>
      ${members.map(m => `
        <div class="stat">
          <span>${m.lastName} ${m.firstName || ''} ${m.role === 'master' ? '<span class="badge">мастер</span>' : ''}</span>
          <span class="v">${state.records.filter(r => r.workerId === m.id && r.date === todayISO()).reduce((s,r)=>s+r.quantity,0)} шт</span>
        </div>
      `).join('')}
    </div>

    <div class="card">
      <h2>Сдельная запись за другого работника</h2>
      <label>Работник</label>
      <select id="brWorker">
        ${members.map(m => `<option value="${m.id}">${m.lastName} ${m.firstName || ''}</option>`).join('')}
      </select>
      <label>Деталь</label>
      <select id="brDet">
        ${state.details.map(d => `<option value="${d.id}">${d.name}</option>`).join('')}
      </select>
      <label>Количество, шт</label>
      <input id="brQty" type="number" min="0" placeholder="0">
      <button style="margin-top:12px;width:100%" onclick="addBrigadeRecord()">+ Добавить</button>
    </div>
  `;
}

window.addBrigadeRecord = () => {
  const wId = document.getElementById('brWorker').value;
  const dId = document.getElementById('brDet').value;
  const qty = +document.getElementById('brQty').value;
  if (!qty || qty <= 0) { toast('Укажите количество', true); return; }
  const det = state.details.find(d => d.id === dId);
  const r = {
    id: uid(), workerId: wId, date: todayISO(),
    categoryId: det.categoryId, detailId: dId, quantity: qty,
    createdAt: new Date().toISOString(), createdBy: state.currentUser,
  };
  state.records.push(r);
  logChange(r.id, 'quantity', null, qty, state.currentUser);
  persist();
  toast('Запись добавлена');
  render();
};

/* ---------- ГРАФИК ---------- */
function renderSchedule() {
  const me = state.users.find(u => u.id === state.currentUser);
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const key = `${y}-${String(m + 1).padStart(2, '0')}`;
  const mySched = state.schedule[me.id] || {};

  let cells = '';
  for (let d = 1; d <= daysInMonth; d++) {
    const iso = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const v = mySched[iso] || '';
    const color = v === 'day' ? '#059669' : v === 'night' ? '#7c3aed' : v === 'off' ? '#9ca3af' : '#e5e7eb';
    cells += `<div style="background:${color};color:#fff;padding:6px;text-align:center;border-radius:6px;font-size:12px;cursor:pointer" onclick="cycleDay('${me.id}','${iso}')">${d}<br><span style="font-size:10px">${v === 'day' ? 'Д' : v === 'night' ? 'Н' : v === 'off' ? 'В' : '·'}</span></div>`;
  }

  app.innerHTML = `
    <div class="card">
      <h2>📅 График · ${monthName(key)}</h2>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">${cells}</div>
      <p style="font-size:12px;color:#6b7280;margin-top:10px">Нажимайте на день, чтобы переключить: Д (день) → Н (ночь) → В (выход) → пусто.</p>
    </div>

    <div class="card">
      <h3>Шаблон ротации</h3>
      <div class="row">
        <div><label>Дней смены</label><input type="number" id="tplOn" value="2" min="1"></div>
        <div><label>Дней отдыха</label><input type="number" id="tplOff" value="2" min="0"></div>
      </div>
      <label>Тип</label>
      <select id="tplType">
        <option value="day">День</option>
        <option value="night">Ночь</option>
      </select>
      <button style="margin-top:10px;width:100%" onclick="applyTemplate()">Заполнить месяц</button>
    </div>
  `;
}

window.cycleDay = (uid_, iso) => {
  if (!state.schedule[uid_]) state.schedule[uid_] = {};
  const cur = state.schedule[uid_][iso] || '';
  const next = cur === '' ? 'day' : cur === 'day' ? 'night' : cur === 'night' ? 'off' : '';
  if (next) state.schedule[uid_][iso] = next;
  else delete state.schedule[uid_][iso];
  persist();
  render();
};

window.applyTemplate = () => {
  const on = +document.getElementById('tplOn').value;
  const off = +document.getElementById('tplOff').value;
  const type = document.getElementById('tplType').value;
  const me = state.users.find(u => u.id === state.currentUser);
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  if (!state.schedule[me.id]) state.schedule[me.id] = {};
  const cycle = on + off;
  for (let d = 1; d <= daysInMonth; d++) {
    const iso = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const pos = (d - 1) % cycle;
    if (pos < on) state.schedule[me.id][iso] = type;
    else delete state.schedule[me.id][iso];
  }
  persist();
  toast('Шаблон применён');
  render();
};

/* ---------- ЗАРПЛАТА ---------- */
function renderSalary() {
  const me = state.users.find(u => u.id === state.currentUser);
  const settings = state.salarySettings[me.id] || {};
  const now = new Date();
  const curMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  const prev = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  const prevMonth = `${prev.getFullYear()}-${String(prev.getMonth() + 1).padStart(2, '0')}`;

  const curOutput = state.records.filter(r => r.workerId === me.id && monthKey(r.date) === curMonth).reduce((s, r) => s + (+r.quantity || 0), 0);
  const prevOutput = settings.lastMonthOutput ?? state.records.filter(r => r.workerId === me.id && monthKey(r.date) === prevMonth).reduce((s, r) => s + (+r.quantity || 0), 0);
  const lastSalary = settings.lastMonthSalary ?? 0;
  const avgPrice = prevOutput > 0 ? lastSalary / prevOutput : 0;
  const calcSalary = avgPrice * curOutput;

  app.innerHTML = `
    <details class="summary" open>
      <summary>📊 Моя зарплата по средней стоимости изделия</summary>
      <div class="body">
        <p style="font-size:12px;color:#6b7280;margin-bottom:8px">
          Средняя стоимость = зарплата за прошлый месяц ÷ выработка за прошлый месяц.<br>
          Расчётная зарплата = средняя стоимость × выработка за текущий месяц.
        </p>
        <label>Моя зарплата за прошлый месяц (${monthName(prevMonth)}), ₽</label>
        <input type="number" id="sLastSal" value="${lastSalary || ''}" placeholder="0">
        <label>Выработка за прошлый месяц, шт (авто или вручную)</label>
        <input type="number" id="sLastOut" value="${prevOutput || ''}" placeholder="0">
        <div class="stat"><span>Средняя стоимость изделия</span><span class="v">${avgPrice ? avgPrice.toFixed(2) + ' ₽' : '—'}</span></div>
        <div class="stat"><span>Выработка за ${monthName(curMonth)}</span><span class="v">${curOutput} шт</span></div>
        <div class="stat"><span>Расчётная зарплата за текущий месяц</span><span class="v">${fmtMoney(calcSalary)}</span></div>
        <button style="margin-top:10px;width:100%" onclick="saveSalary()">Сохранить</button>
      </div>
    </details>

    <div class="card">
      <h2>💰 Зарплата по работникам бригады</h2>
      ${brigadeSalaryTable(curMonth)}
    </div>
  `;
}

function brigadeSalaryTable(month) {
  const me = state.users.find(u => u.id === state.currentUser);
  const b = state.brigades.find(x => x.id === me.brigadeId);
  const members = state.users.filter(u => u.brigadeId === b.id);
  const rows = members.map(m => {
    const out = state.records.filter(r => r.workerId === m.id && monthKey(r.date) === month).reduce((s, r) => s + (+r.quantity || 0), 0);
    const s = state.salarySettings[m.id] || {};
    const prevOut = s.lastMonthOutput ?? 0;
    const lastSal = s.lastMonthSalary ?? 0;
    const avg = prevOut > 0 ? lastSal / prevOut : 0;
    const calc = avg * out;
    return `<div class="stat"><span>${m.lastName} ${m.firstName || ''}<br><small style="color:#6b7280">${out} шт · ср. ${avg.toFixed(2)} ₽/шт</small></span><span class="v">${fmtMoney(calc)}</span></div>`;
  }).join('');
  return rows || '<div class="empty">Нет данных</div>';
}

window.saveSalary = () => {
  const me = state.users.find(u => u.id === state.currentUser);
  state.salarySettings[me.id] = {
    lastMonthSalary: +document.getElementById('sLastSal').value || 0,
    lastMonthOutput: +document.getElementById('sLastOut').value || 0,
  };
  persist();
  toast('Сохранено');
  render();
};

/* ---------- ИСТОРИЯ (поиск, фильтры, архивы) ---------- */
function renderHistory() {
  const me = state.users.find(u => u.id === state.currentUser);
  const b = state.brigades.find(x => x.id === me.brigadeId);
  const members = state.users.filter(u => u.brigadeId === b.id);

  // все месяцы, по которым есть записи
  const months = [...new Set(state.records.map(r => monthKey(r.date)))].sort().reverse();

  app.innerHTML = `
    <div class="card">
      <h2>🔍 История · поиск и фильтры</h2>
      <div class="filter-bar">
        <input id="fSearch" placeholder="🔎 Поиск по детали / работнику..." class="full">
        <select id="fWorker">
          <option value="">Все работники</option>
          ${members.map(m => `<option value="${m.id}">${m.lastName} ${m.firstName || ''}</option>`).join('')}
        </select>
        <select id="fDetail">
          <option value="">Все детали</option>
          ${state.details.map(d => `<option value="${d.id}">${d.name}</option>`).join('')}
        </select>
        <input type="month" id="fMonth" value="${months[0] || ''}">
        <div>
          <label style="margin:0;font-size:12px">Период с</label>
          <input type="date" id="fFrom">
        </div>
        <div>
          <label style="margin:0;font-size:12px">Период по</label>
          <input type="date" id="fTo">
        </div>
      </div>
      <div class="row">
        <button class="secondary" onclick="clearFilters()">Сбросить</button>
        <button onclick="applyFilters()">Применить</button>
      </div>
    </div>

    <div id="historyResult"></div>
  `;

  // обработчики
  ['fSearch','fWorker','fDetail','fMonth','fFrom','fTo'].forEach(id => {
    document.getElementById(id).addEventListener('input', applyFilters);
    document.getElementById(id).addEventListener('change', applyFilters);
  });

  applyFilters();
}

window.clearFilters = () => {
  ['fSearch','fWorker','fDetail','fMonth','fFrom','fTo'].forEach(id => document.getElementById(id).value = '');
  applyFilters();
};

window.applyFilters = () => {
  const me = state.users.find(u => u.id === state.currentUser);
  const b = state.brigades.find(x => x.id === me.brigadeId);
  const memberIds = new Set(b.members);

  const search = (document.getElementById('fSearch')?.value || '').toLowerCase().trim();
  const wId = document.getElementById('fWorker')?.value || '';
  const dId = document.getElementById('fDetail')?.value || '';
  const month = document.getElementById('fMonth')?.value || '';
  const from = document.getElementById('fFrom')?.value || '';
  const to = document.getElementById('fTo')?.value || '';

  let list = state.records.filter(r => memberIds.has(r.workerId));
  if (wId) list = list.filter(r => r.workerId === wId);
  if (dId) list = list.filter(r => r.detailId === dId);
  if (month) list = list.filter(r => monthKey(r.date) === month);
  if (from) list = list.filter(r => r.date >= from);
  if (to) list = list.filter(r => r.date <= to);
  if (search) {
    list = list.filter(r => {
      const dn = getDetailName(r.detailId).toLowerCase();
      const cn = getCategoryName(r.categoryId).toLowerCase();
      const wn = getUserName(r.workerId).toLowerCase();
      return dn.includes(search) || cn.includes(search) || wn.includes(search);
    });
  }

  // группировка по месяцам
  const groups = {};
  list.forEach(r => {
    const k = monthKey(r.date);
    if (!groups[k]) groups[k] = [];
    groups[k].push(r);
  });
  const sortedKeys = Object.keys(groups).sort().reverse();

  const container = document.getElementById('historyResult');
  if (sortedKeys.length === 0) {
    container.innerHTML = '<div class="card"><div class="empty">Ничего не найдено</div></div>';
    return;
  }

  container.innerHTML = sortedKeys.map(k => {
    const recs = groups[k].sort((a, b) => b.date.localeCompare(a.date));
    const total = recs.reduce((s, r) => s + (+r.quantity || 0), 0);
    return `
      <div class="month-group">
        <h3>📦 ${monthName(k)} · ${recs.length} записей · итого: ${total} шт</h3>
        <div class="body">
          ${recs.map(r => `
            <div class="record">
              <div class="top">
                <div>
                  <div><b>${getDetailName(r.detailId)}</b> <span class="badge">${getCategoryName(r.categoryId)}</span></div>
                  <div class="meta">📅 ${fmtDate(r.date)} · 👤 ${getUserName(r.workerId)} · автор: ${getUserName(r.createdBy)}</div>
                </div>
                <div class="qty">${r.quantity} шт</div>
              </div>
              <div class="actions" style="margin-top:8px">
                <button class="small secondary" onclick="editRecord('${r.id}')">✎ Изменить</button>
                <button class="small danger" onclick="deleteRecord('${r.id}')">🗑 Удалить</button>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');
};

/* ---------- ОТЧЁТ ---------- */
function renderReport() {
  const me = state.users.find(u => u.id === state.currentUser);
  const b = state.brigades.find(x => x.id === me.brigadeId);
  const members = state.users.filter(u => u.brigadeId === b.id);

  app.innerHTML = `
    <div class="card">
      <h2>📄 Отчёт</h2>
      <label>Тип отчёта</label>
      <select id="rType">
        <option value="brigade-day">Бригада за смену</option>
        <option value="worker-month">Работник — месяц</option>
        <option value="my-month">Моя сделка — месяц</option>
      </select>
      <label>Месяц</label>
      <input type="month" id="rMonth" value="${todayISO().slice(0, 7)}">
      <label>Работник (если нужно)</label>
      <select id="rWorker">
        ${members.map(m => `<option value="${m.id}">${m.lastName} ${m.firstName || ''}</option>`).join('')}
      </select>
      <button style="margin-top:12px;width:100%" onclick="generateReport()">Сформировать</button>
    </div>
    <div id="reportOut"></div>
  `;
}

window.generateReport = () => {
  const type = document.getElementById('rType').value;
  const month = document.getElementById('rMonth').value;
  const wId = document.getElementById('rWorker').value;
  const out = document.getElementById('reportOut');

  if (type === 'worker-month' || type === 'my-month') {
    const target = type === 'my-month' ? state.currentUser : wId;
    const recs = state.records.filter(r => r.workerId === target && monthKey(r.date) === month);
    const byDetail = {};
    recs.forEach(r => {
      const k = getDetailName(r.detailId);
      byDetail[k] = (byDetail[k] || 0) + (+r.quantity || 0);
    });
    const total = recs.reduce((s, r) => s + (+r.quantity || 0), 0);
    out.innerHTML = `
      <div class="card">
        <h2>Выписка · ${getUserName(target)} · ${monthName(month)}</h2>
        ${Object.entries(byDetail).map(([n, q]) => `<div class="stat"><span>${n}</span><span class="v">${q} шт</span></div>`).join('')}
        <div class="stat"><span><b>Итого</b></span><span class="v">${total} шт</span></div>
        <button style="margin-top:10px;width:100%" onclick="window.print()">🖨 Печать</button>
      </div>
    `;
  } else {
    const me = state.users.find(u => u.id === state.currentUser);
    const b = state.brigades.find(x => x.id === me.brigadeId);
    const members = state.users.filter(u => u.brigadeId === b.id);
    const todayRecs = state.records.filter(r => r.date === todayISO() && members.some(m => m.id === r.workerId));
    out.innerHTML = `
      <div class="card">
        <h2>Бригада за смену · ${fmtDate(todayISO())}</h2>
        ${members.map(m => {
          const q = todayRecs.filter(r => r.workerId === m.id).reduce((s,r)=>s+r.quantity,0);
          return `<div class="stat"><span>${m.lastName} ${m.firstName || ''}</span><span class="v">${q} шт</span></div>`;
        }).join('')}
        <div class="stat"><span><b>Итого</b></span><span class="v">${todayRecs.reduce((s,r)=>s+r.quantity,0)} шт</span></div>
        <button style="margin-top:10px;width:100%" onclick="window.print()">🖨 Печать</button>
      </div>
    `;
  }
};

/* ---------- МОДАЛКИ ---------- */
function openModal(html) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.id = 'modalBg';
  bg.innerHTML = `<div class="modal">${html}</div>`;
  bg.addEventListener('click', (e) => { if (e.target === bg) closeModal(); });
  document.body.appendChild(bg);
}
window.closeModal = () => document.getElementById('modalBg')?.remove();

/* ---------- СТАРТ ---------- */
render();
</script>
</body>
</html>
