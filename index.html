<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Учёт деталей</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-storage-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --accent: #3390EC;
    --accent-dark: #2679C9;
    --whatsapp: #25D366;
    --whatsapp-dark: #1DA851;
    --telegram: #229ED9;
    --telegram-dark: #1B87BD;
    --vk: #0077FF;
    --vk-dark: #0062D1;
    --bg: #F0F1F3;
    --card: #FFFFFF;
    --text: #1C1C1E;
    --text-secondary: #8E8E93;
    --border: #E4E5E7;
    --danger: #E5484D;
    --success: #34A853;
    --success-dark: #1E8A44;
    --radius: 14px;
    --mono: 'SF Mono', 'Roboto Mono', Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%; max-width:480px; min-height:100vh;
    background:var(--bg); display:flex; flex-direction:column; position:relative;
  }

  .topbar{
    background:var(--accent); color:#fff; padding:14px 16px;
    position:sticky; top:0; z-index:20; box-shadow:0 2px 8px rgba(0,0,0,.08);
  }
  .topbar-row{ display:flex; align-items:center; justify-content:space-between; }
  .topbar-title{ font-size:17px; font-weight:600; }
  .topbar-sub{ font-size:12.5px; opacity:.85; margin-top:2px; }
  .topbar-code{ font-size:12px; opacity:.9; margin-top:6px; font-family:var(--mono); letter-spacing:1px; }
  .topbar-actions{ display:flex; gap:8px; flex-shrink:0; }
  .icon-btn{
    background:rgba(255,255,255,.18); border:none; color:#fff;
    width:32px;height:32px; border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer; font-size:16px; flex-shrink:0;
  }
  .icon-btn:active{ background:rgba(255,255,255,.3); }

  .content{ flex:1; padding:16px; padding-bottom:90px; }

  .card{
    background:var(--card); border-radius:var(--radius); padding:16px;
    margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.04); border:1px solid var(--border);
  }

  .field{ margin-bottom:14px; }
  .field:last-child{ margin-bottom:0; }
  .field label{ display:block; font-size:13px; color:var(--text-secondary); margin-bottom:6px; font-weight:500; }
  .field input, .field select{
    width:100%; padding:12px 14px; border:1.5px solid var(--border); border-radius:10px;
    font-size:16px; background:#FAFAFA; color:var(--text); outline:none;
    transition:border-color .15s; font-family:inherit; appearance:none; -webkit-appearance:none;
  }
  .field select{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238E8E93'><path d='M7 10l5 5 5-5z'/></svg>");
    background-repeat:no-repeat; background-position:right 12px center; background-size:20px; padding-right:38px;
  }
  .field input:focus, .field select:focus{ border-color:var(--accent); background-color:#fff; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .select-with-btn{ display:flex; gap:8px; }
  .select-with-btn select, .select-with-btn input{ flex:1; }
  .add-btn{
    flex-shrink:0; width:44px; border-radius:10px; border:1.5px solid var(--accent);
    background:#fff; color:var(--accent); font-size:20px; font-weight:600; cursor:pointer;
  }
  .add-panel{
    display:none; gap:8px; margin-top:10px; padding-top:10px; border-top:1px dashed var(--border);
  }
  .add-panel.open{ display:flex; }
  .add-panel input{ flex:1; }
  .add-panel button.save-btn{
    flex-shrink:0; padding:0 14px; border-radius:10px; border:none; background:var(--accent); color:#fff; font-weight:600; cursor:pointer;
  }
  .manage-details{ margin-top:12px; }
  .manage-details summary{ font-size:12.5px; color:var(--accent); cursor:pointer; list-style:none; }
  .manage-details summary::-webkit-details-marker{ display:none; }
  .manage-block{ margin-top:12px; }
  .manage-block-title{ font-size:11.5px; font-weight:700; color:var(--text-secondary); text-transform:uppercase; margin-bottom:6px; }
  .chip-list{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .chip{
    display:flex; align-items:center; gap:5px; background:#F4F4F5; border:1px solid var(--border);
    border-radius:16px; padding:5px 6px 5px 12px; font-size:12.5px;
  }
  .chip button{
    background:none; border:none; color:var(--text-secondary); font-size:14px; cursor:pointer;
    width:18px; height:18px; display:flex; align-items:center; justify-content:center;
  }
  .chip.chip-excluded{ background:#FFF4E5; border-color:#F4D9A8; }

  .user-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 4px; border-bottom:1px solid var(--border);
  }
  .user-row:last-child{ border-bottom:none; }
  .user-info{ display:flex; align-items:center; gap:8px; min-width:0; }
  .user-avatar{
    width:28px; height:28px; border-radius:50%; background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700; flex-shrink:0;
  }
  .user-name-wrap{ min-width:0; }
  .user-name{ font-size:13.5px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .user-tag{
    display:inline-block; font-size:10px; font-weight:700; color:var(--accent-dark);
    background:#EAF3FE; border-radius:6px; padding:1px 6px; margin-left:6px; vertical-align:1px;
  }
  .user-meta{ font-size:11.5px; color:var(--text-secondary); margin-top:1px; }
  .user-stat{ text-align:right; flex-shrink:0; }
  .user-stat .val{ font-family:var(--mono); font-size:14px; font-weight:700; color:var(--accent); }
  .user-stat .lbl{ font-size:10px; color:var(--text-secondary); }

  .payroll-row{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 16px; margin-bottom:10px;
  }
  .payroll-worker{ font-size:14px; font-weight:700; color:var(--text); margin-bottom:10px; }
  .payroll-total{
    display:flex; justify-content:space-between; align-items:center; margin-top:10px;
    padding-top:10px; border-top:1px dashed var(--border); font-size:13px; color:var(--text-secondary);
  }
  .payroll-total .val{ font-family:var(--mono); font-size:16px; font-weight:800; color:var(--accent); }

  .payroll-calc{
    border:1px dashed var(--border); border-radius:12px; padding:10px 12px;
    background:#FAFBFF; margin-bottom:4px;
  }
  .payroll-calc summary{
    font-size:12.5px; font-weight:700; color:var(--accent-dark); cursor:pointer; list-style:none;
  }
  .payroll-calc summary::-webkit-details-marker{ display:none; }
  .payroll-calc summary::before{ content:'▸ '; }
  .payroll-calc[open] summary::before{ content:'▾ '; }
  .calc-stats{ display:flex; flex-direction:column; gap:5px; margin:8px 0 10px; }
  .calc-stat{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    font-size:12px; color:var(--text-secondary);
  }
  .calc-stat b{ font-family:var(--mono); font-size:12.5px; color:var(--text); font-weight:700; white-space:nowrap; }
  .calc-salary{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:#E9F9EE; border:1px solid #B9E8C6; border-radius:10px; padding:10px 12px;
  }
  .calc-salary .lbl{ font-size:12.5px; color:#1E8A44; font-weight:600; }
  .calc-salary .val{ font-family:var(--mono); font-size:16px; font-weight:800; color:#1E8A44; white-space:nowrap; }
  .calc-autofill{
    display:flex; align-items:center; gap:8px; margin-top:10px;
    font-size:12.5px; color:var(--text-secondary);
  }
  .calc-autofill input{ width:auto; margin:0; }

  .forecast-card{
    background:linear-gradient(135deg, #EAF3FE 0%, #F5F8FF 100%);
    border:1px solid #CFE4FB; border-radius:12px;
    padding:14px 16px; margin-top:12px;
  }
  .forecast-title{
    font-size:11.5px; font-weight:700; color:var(--accent-dark);
    text-transform:uppercase; letter-spacing:.3px; margin-bottom:8px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .forecast-title .badge{
    font-size:10px; font-weight:600; text-transform:none; letter-spacing:0;
    background:#fff; color:var(--accent-dark); border-radius:6px; padding:2px 6px;
  }
  .forecast-big{
    font-family:var(--mono); font-size:24px; font-weight:800;
    color:var(--accent-dark); line-height:1.1; margin:4px 0 2px;
  }
  .forecast-sub{
    font-size:12px; color:var(--text-secondary); margin-bottom:10px;
  }
  .forecast-bars{
    display:flex; flex-direction:column; gap:6px; font-size:12px;
  }
  .forecast-bar-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .forecast-bar-row .lbl{ color:var(--text-secondary); }
  .forecast-bar-row .val{ font-family:var(--mono); font-weight:700; color:var(--text); white-space:nowrap; }
  .forecast-progress{
    height:6px; background:#DBE6F3; border-radius:3px; overflow:hidden; margin-top:6px;
  }
  .forecast-progress-fill{
    height:100%; background:var(--accent); border-radius:3px;
    transition: width .3s ease;
  }
  .forecast-hint{
    font-size:11px; color:var(--text-secondary); margin-top:8px; line-height:1.35;
  }

  .btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    width:100%; padding:13px 16px; border-radius:12px; border:none;
    font-size:15.5px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:active{ background:var(--accent-dark); }
  .btn-secondary{ background:#fff; color:var(--accent); border:1.5px solid var(--accent); }
  .btn-whatsapp{ background:var(--whatsapp); color:#fff; }
  .btn-whatsapp:active{ background:var(--whatsapp-dark); }
  .btn-telegram{ background:var(--telegram); color:#fff; }
  .btn-telegram:active{ background:var(--telegram-dark); }
  .btn-vk{ background:var(--vk); color:#fff; }
  .btn-vk:active{ background:var(--vk-dark); }
  .btn-repeat{ background:#EAF3FE; color:var(--accent-dark); border:1.5px solid #CFE4FB; }
  .btn-repeat:active{ background:#DBEAFB; }
  .btn[disabled]{ opacity:.5; cursor:not-allowed; }

  .hint{ font-size:12px; color:var(--text-secondary); line-height:1.4; margin-top:6px; }

  .section-title{
    font-size:13px; font-weight:600; color:var(--text-secondary);
    text-transform:uppercase; letter-spacing:.3px; margin:20px 0 8px 4px;
  }
  .section-title:first-child{ margin-top:0; }

  .worker-block{ margin-bottom:4px; }
  .worker-header{ display:flex; align-items:center; justify-content:space-between; padding:0 4px; margin:14px 0 6px; }
  .worker-name{ font-size:14.5px; font-weight:700; color:var(--text); }
  .worker-name .avatar{
    display:inline-flex; align-items:center; justify-content:center;
    width:20px; height:20px; border-radius:50%; background:var(--accent);
    color:#fff; font-size:10.5px; font-weight:700; margin-right:6px; vertical-align:-4px;
  }
  .worker-subtotal{ font-family:var(--mono); font-size:13px; color:var(--text-secondary); }

  .entry-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:12px 14px; margin-bottom:8px;
  }
  .entry-info{ flex:1; min-width:0; }
  .entry-part{ font-size:15px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .entry-meta{ font-size:12px; color:var(--text-secondary); margin-top:2px; }
  .entry-qty{ font-family:var(--mono); font-size:17px; font-weight:700; color:var(--accent); margin-left:10px; white-space:nowrap; }
  .entry-actions{ display:flex; gap:2px; margin-left:6px; flex-shrink:0; }
  .entry-del, .entry-edit{ background:none; border:none; color:var(--text-secondary); font-size:18px; padding:4px 8px; cursor:pointer; }
  .entry-edit{ color: var(--accent); font-size:16px; }
  .entry-log{ font-size:11px; color:var(--text-secondary); margin-top:4px; font-style:italic; }

  .empty-state{ text-align:center; padding:32px 20px; color:var(--text-secondary); }
  .empty-state .emoji{ font-size:32px; margin-bottom:8px; }
  .empty-state .msg{ font-size:14px; line-height:1.5; }

  .day-total-bar{
    display:flex; align-items:center; justify-content:space-between;
    background:#EAF3FE; border:1px solid #CFE4FB; border-radius:12px;
    padding:12px 16px; margin:16px 0;
  }
  .day-total-bar .label{ font-size:13.5px; color:var(--accent-dark); font-weight:600; }
  .day-total-bar .val{ font-family:var(--mono); font-size:19px; font-weight:800; color:var(--accent-dark); }
  .day-total-bar.personal{ background:#E9F9EE; border-color:#B9E8C6; }

  .mini-dash{ display:flex; gap:8px; margin-bottom:14px; }
  .mini-dash-item{
    flex:1; background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:12px 6px; text-align:center;
  }
  .mini-dash-val{ font-family:var(--mono); font-size:20px; font-weight:800; color:var(--accent); line-height:1.1; }
  .mini-dash-lbl{ font-size:10.5px; color:var(--text-secondary); margin-top:3px; text-transform:uppercase; letter-spacing:.2px; }
  .day-total-bar.personal .label{ color:#1E8A44; }
  .day-total-bar.personal .val{ color:#1E8A44; }

  .sched-legend{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .sched-legend-item{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-secondary); }
  .sched-legend-dot{ width:14px; height:14px; border-radius:5px; flex-shrink:0; }

  .sched-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:var(--radius); border:1px solid var(--border); background:#fff; }
  table.sched-table{ border-collapse:collapse; font-size:12px; }
  table.sched-table th, table.sched-table td{ padding:0; text-align:center; }
  table.sched-table th{
    font-size:10.5px; font-weight:700; color:var(--text-secondary); padding:8px 4px;
    border-bottom:1.5px solid var(--border); background:#FAFAFA; position:sticky; top:0;
  }
  .sched-worker-cell{
    position:sticky; left:0; background:#FAFAFA; text-align:left !important;
    padding:10px 12px !important; font-weight:600; font-size:12.5px; white-space:nowrap;
    border-right:1.5px solid var(--border); z-index:2;
  }
  .sched-day-col{ width:34px; min-width:34px; }
  .sched-cell{
    width:34px; height:34px; cursor:pointer; border-bottom:1px solid var(--border);
    border-left:1px solid #F4F4F5;
  }
  .sched-cell:not(.owner-editable){ cursor:default; }
  .sched-badge{
    width:26px; height:26px; margin:4px auto; border-radius:7px;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:800; color:#fff;
  }

  .sched-my-list{ margin-top:4px; }
  .sched-my-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:11px 14px; margin-bottom:8px;
  }
  .sched-my-date{ font-size:14px; font-weight:600; }
  .sched-my-type{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-secondary); }

  .tabbar{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px; background:#fff; border-top:1px solid var(--border);
    display:flex; padding-bottom:env(safe-area-inset-bottom); z-index:15;
  }
  .tab-btn{
    flex:1; background:none; border:none; padding:9px 4px 8px;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--text-secondary); font-family:inherit; cursor:pointer;
  }
  .tab-btn .tab-icon{ font-size:20px; line-height:1; }
  .tab-btn .tab-label{ font-size:11px; font-weight:600; }
  .tab-btn.active{ color:var(--accent); }

  .reg-wrap{ padding:40px 20px; display:flex; flex-direction:column; align-items:center; }
  .reg-logo{
    width:64px;height:64px; border-radius:18px; background:var(--accent);
    display:flex;align-items:center;justify-content:center; font-size:30px; margin-bottom:16px; color:#fff;
  }
  .reg-title{ font-size:20px; font-weight:700; margin-bottom:4px; text-align:center; }
  .reg-sub{ font-size:14px; color:var(--text-secondary); text-align:center; margin-bottom:28px; line-height:1.5; }
  .reg-card{ width:100%; }

  .seg-control{ display:flex; flex-wrap:wrap; gap:6px; background:#F0F1F3; border-radius:12px; padding:4px; }
  .seg-btn{
    flex:1 1 30%; min-width:30%; border:none; background:none; padding:9px 4px 8px; border-radius:9px;
    font-size:10.5px; font-weight:600; color:var(--text-secondary); cursor:pointer; font-family:inherit;
    line-height:1.25;
  }
  .seg-btn.active{ background:#fff; color:var(--accent); box-shadow:0 1px 3px rgba(0,0,0,.08); }

  .code-reveal{
    background:#EAF3FE; border:1.5px dashed var(--accent); border-radius:12px;
    padding:14px; text-align:center; margin-top:6px;
  }
  .code-reveal .code-val{
    font-family:var(--mono); font-size:24px; font-weight:800; letter-spacing:3px; color:var(--accent-dark);
    margin:4px 0 8px;
  }

  .report-doc{ background:#fff; border-radius:var(--radius); padding:20px 18px; border:1px solid var(--border); }
  .report-doc h2{ font-size:16px; margin:0 0 2px; text-align:center; }
  .report-doc .report-meta{ font-size:12.5px; color:var(--text-secondary); text-align:center; margin-bottom:16px; }
  .report-doc .report-field{ display:flex; justify-content:space-between; font-size:13.5px; padding:6px 0; border-bottom:1px dashed var(--border); }
  .report-doc .report-field span:first-child{ color:var(--text-secondary); }
  .report-section-title{
    font-size:11.5px; font-weight:700; color:var(--text-secondary); text-transform:uppercase;
    letter-spacing:.3px; margin:16px 0 2px;
  }
  table.report-table{ width:100%; border-collapse:collapse; margin-top:14px; font-size:13.5px; }
  table.report-table th{ text-align:left; font-size:11.5px; color:var(--text-secondary); text-transform:uppercase; letter-spacing:.2px; padding:7px 4px; border-bottom:1.5px solid var(--text); }
  table.report-table td{ padding:8px 4px; border-bottom:1px solid var(--border); }
  table.report-table td.qty{ font-family:var(--mono); font-weight:700; text-align:right; }
  table.report-table tr.cat-row td{
    background:#F4F4F5; font-weight:700; font-size:12px; text-transform:uppercase;
    letter-spacing:.3px; color:var(--accent-dark); padding-top:10px; padding-bottom:6px; border-bottom:1px solid var(--border);
  }
  .report-total{ display:flex; justify-content:space-between; align-items:center; margin-top:14px; padding-top:12px; border-top:2px solid var(--text); font-weight:700; font-size:15px; }
  .report-total .val{ font-family:var(--mono); color:var(--accent); font-size:18px; }
  .report-actions{ display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
  .report-actions .btn{ flex:1; min-width:130px; }

  .naryad-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:var(--radius); }
  .naryad-doc{ background:#fff; border-radius:var(--radius); border:1px solid var(--border); padding:16px; }
  .naryad-head{ text-align:center; margin-bottom:10px; }
  .naryad-head h2{ font-size:15px; margin:0 0 6px; }
  .naryad-head .row{ display:flex; justify-content:space-between; font-size:12px; padding:2px 0; border-bottom:1px dashed var(--border); }
  .naryad-head .row span:first-child{ color:var(--text-secondary); }
  table.naryad-table{ border-collapse:collapse; font-size:10px; white-space:nowrap; margin-top:10px; }
  table.naryad-table th, table.naryad-table td{
    border:1px solid var(--border); padding:3px 4px; text-align:center; min-width:20px;
  }
  table.naryad-table th{ background:#F4F4F5; font-weight:700; font-size:9.5px; }
  table.naryad-table td.naryad-name{ text-align:left; min-width:120px; font-weight:600; white-space:normal; }
  table.naryad-table td.naryad-future{ background:#FAFAFA; }
  table.naryad-table td.naryad-total{ font-family:var(--mono); font-weight:700; background:#F4F4F5; }
  table.naryad-table tr.naryad-sum-row td{ font-weight:700; background:#EAF3FE; }
  .naryad-sign{ display:flex; justify-content:space-between; gap:20px; margin-top:16px; font-size:11.5px; }
  .naryad-sign div{ flex:1; border-top:1px solid var(--text); padding-top:4px; color:var(--text-secondary); }

  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-weekday{ font-size:10px; font-weight:700; color:var(--text-secondary); text-align:center; padding:4px 0; text-transform:uppercase; }
  .cal-day{
    aspect-ratio:1; border-radius:10px; border:1.5px solid var(--border); background:#FAFAFA;
    cursor:pointer; padding:0; position:relative; overflow:hidden;
  }
  .cal-day.empty{ visibility:hidden; cursor:default; }
  .cal-day.today{ border-color:var(--accent); border-width:2px; }
  .cal-day.selected{ outline:2px solid var(--accent-dark); outline-offset:1px; }
  .cal-day.readonly{ cursor:default; }
  .cal-day-fill{ position:absolute; inset:0; display:flex; flex-direction:column; }
  .cal-day-fill > div{ flex:1; }
  .cal-day-num{
    position:absolute; top:3px; left:3px; z-index:2;
    background:rgba(255,255,255,.88); color:var(--text);
    font-size:10.5px; font-weight:700; line-height:1; border-radius:6px; padding:3px 5px;
  }

  .shift-chip{ display:flex; align-items:center; gap:6px; }
  .shift-dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }

  .day-editor-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 0; border-bottom:1px solid var(--border); }
  .day-editor-row:last-child{ border-bottom:none; }
  .day-editor-worker{ font-size:14px; font-weight:600; flex:1; min-width:0; }
  .day-editor-row select{ width:150px; flex-shrink:0; }

  @media print{
    body *{ visibility:hidden; }
    .report-doc, .report-doc *{ visibility:visible; }
    .report-doc{ position:absolute; top:0; left:0; width:100%; border:none; }
    .naryad-doc, .naryad-doc *{ visibility:visible; }
    .naryad-doc{ position:absolute; top:0; left:0; width:100%; border:none; }
  }

  .toast{
    position:fixed; bottom:78px; left:50%; transform:translateX(-50%);
    background:#1C1C1E; color:#fff; padding:10px 18px; border-radius:20px;
    font-size:13.5px; z-index:100; opacity:0; transition:opacity .25s, bottom .25s;
    pointer-events:none; white-space:nowrap;
  }
  .toast.show{ opacity:1; bottom:88px; }

  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.45);
    z-index:250; align-items:center; justify-content:center; padding:16px;
  }
  .modal-overlay.open{ display:flex; }
  .modal-card{
    background:#fff; border-radius:16px; padding:20px; width:100%; max-width:400px;
    max-height:90vh; overflow-y:auto;
  }
  .modal-title{ font-size:17px; font-weight:700; margin-bottom:14px; }
  .modal-actions{ display:flex; gap:10px; margin-top:16px; }
  .modal-actions .btn{ flex:1; }

  .log-item{
    background:#FAFAFA; border:1px solid var(--border); border-radius:10px;
    padding:10px 12px; margin-bottom:8px; font-size:12.5px;
  }
  .log-item .log-head{ font-weight:600; color:var(--text); margin-bottom:4px; }
  .log-item .log-change{ color:var(--text-secondary); }
  .log-item .log-change b{ color:var(--accent-dark); }

  .filters-card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 16px; margin-bottom:14px;
  }
  .filter-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .filter-row:last-child{ margin-bottom:0; }
  .filter-row .field{ flex:1; min-width:120px; margin-bottom:0; }
  .filter-results{ margin-top:10px; }
